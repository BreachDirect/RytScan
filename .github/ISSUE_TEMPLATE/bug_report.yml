name: Bug report
description: Report a bug in RytScan
title: "[bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
  - type: input
    id: version
    attributes:
      label: RytScan version
      description: Commit hash, tag, or crate version
      placeholder: "main@abc1234 or v0.1.0"
    validations:
      required: true
  - type: input
    id: rustc
    attributes:
      label: Rust version
      description: Output of `rustc --version`
      placeholder: "rustc 1.95.0"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal source snippet or fixture that triggers the bug, plus the command you ran
      placeholder: |
        `rytscan scan ./my-contract --format sarif`
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
      description: Include exit codes and relevant output (text, JSON, or SARIF)
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Impact
      options:
        - False negative (missed vulnerability)
        - False positive (incorrect finding)
        - Crash / panic
        - Broken output (JSON/SARIF)
        - Other
    validations:
      required: true
