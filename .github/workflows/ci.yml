name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy with warnings denied
        run: cargo clippy --workspace --all-targets -- -D warnings

  security:
    name: Dependency audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit@0.22.2 --locked
      - name: Run cargo audit
        run: cargo audit

  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace
      - name: Run unit tests
        run: cargo test --workspace

  smoke:
    name: Smoke test (fixtures + SARIF)
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p rytscan-cli
      - name: Vulnerable fixture must produce high-severity findings (exit 1)
        run: |
          set +e
          ./target/debug/rytscan scan fixtures/vulnerable-vault/src --fail-on high
          code=$?
          set -e
          test "$code" -eq 1
      - name: Clean fixture must pass with --fail-on high
        run: ./target/debug/rytscan scan fixtures/clean-token/src --fail-on high
      - name: SARIF output must be valid JSON and parse
        run: |
          ./target/debug/rytscan scan fixtures/vulnerable-vault/src --format sarif \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['version']=='2.1.0'; print('SARIF OK,', len(d['runs'][0]['results']), 'results')"
      - name: Generate SARIF for Code Scanning
        run: ./target/debug/rytscan scan fixtures/vulnerable-vault/src --format sarif --fail-on critical > rytscan.sarif
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rytscan.sarif
          category: rytscan
